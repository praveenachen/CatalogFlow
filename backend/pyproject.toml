[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogflow-backend"
version = "0.2.0"
description = "CatalogFlow deterministic catalog processing contracts"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "pandera[pandas]",
  "pydantic",
  "rapidfuzz",
  "sqlmodel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
